<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exagaming URL Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e4e4e7;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 24px;
            color: #fff;
        }
        .card {
            background: #1a1b23;
            border: 1px solid #2a2b35;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #a1a1aa;
        }
        select, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            background: #0f1117;
            border: 1px solid #2a2b35;
            border-radius: 8px;
            color: #e4e4e7;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input:focus {
            border-color: #3b82f6;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row .form-group {
            flex: 1;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.85;
        }
        button:disabled, select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-primary {
            background: #3b82f6;
            color: #fff;
        }
        .btn-secondary {
            background: #27272a;
            color: #e4e4e7;
            border: 1px solid #3f3f46;
        }
        .btn-fetch {
            background: #16a34a;
            color: #fff;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .url-output {
            background: #0f1117;
            border: 1px solid #2a2b35;
            border-radius: 8px;
            padding: 14px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
            word-break: break-all;
            color: #4ade80;
            min-height: 48px;
            line-height: 1.5;
        }
        .url-output.empty {
            color: #71717a;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .usercode-display {
            margin-left: auto;
            font-size: 13px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: #a1a1aa;
            display: none;
        }
        .usercode-display.show {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .usercode-display .usercode-label {
            color: #71717a;
        }
        .usercode-display .usercode-value {
            color: #4ade80;
            font-weight: 600;
        }
        .status {
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }
        .status.success {
            display: block;
            background: rgba(22, 163, 74, 0.15);
            color: #4ade80;
            border: 1px solid rgba(22, 163, 74, 0.3);
        }
        .status.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .status.loading {
            display: block;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #3b82f6;
        }
        .checkbox-row label {
            margin-bottom: 0;
            cursor: pointer;
        }
        .collapsible-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }
        .collapsible-header:hover {
            opacity: 0.85;
        }
        .collapsible-arrow {
            transition: transform 0.2s;
            font-size: 18px;
            color: #a1a1aa;
        }
        .collapsible-arrow.open {
            transform: rotate(180deg);
        }
        .collapsible-body {
            display: none;
            margin-top: 16px;
        }
        .collapsible-body.open {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Exagaming URL Generator</h1>

        <div class="card">
            <div class="row">
                <div class="form-group">
                    <label>Environment</label>
                    <select id="env">
                        <option value="test">Test</option>
                        <option value="stage">Stage</option>
                        <option value="prod">Prod</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Game ID</label>
                    <select id="gameId">
                        <option value="1">1 - Aztec_Man</option>
                        <option value="2">2 - FOLLOWTHEARROW</option>
                        <option value="3">3 - GALAXY_GRAB</option>
                        <option value="4">4 - POWEROFTHOR</option>
                        <option value="30">30 - Plinko</option>
                        <option value="32">32 - Mines</option>
                        <option value="33">33 - Blackjack</option>
                        <option value="34" selected>34 - Wheel</option>
                        <option value="54">54 - Aviator Turbo</option>
                        <option value="55">55 - Tower</option>
                        <option value="56">56 - Limbo</option>
                        <option value="57">57 - Dice</option>
                        <option value="58">58 - Keno</option>
                        <option value="70">70 - Crash</option>
                        <option value="71">71 - Roulette</option>
                        <option value="76">76 - Billionaire</option>
                        <option value="89">89 - Run Chicken Run</option>
                        <option value="90">90 - Chicken Original</option>
                        <option value="93">93 - Blackjack 100</option>
                        <option value="95">95 - Coinflip</option>
                        <option value="96">96 - Scratch</option>
                        <option value="100">100 - Lucky Dice (Dice)</option>
                        <option value="101">101 - Lucky Crash (Crash)</option>
                        <option value="102">102 - Roulette X (Roulette)</option>
                        <option value="103">103 - Spin X (Wheel)</option>
                        <optgroup label="New Games (Test only)">
                            <option value="new_mines">New Mines</option>
                            <option value="new_tower">New Tower</option>
                            <option value="new_dice">New Dice</option>
                            <option value="new_crash">New Crash</option>
                            <option value="new_limbo">New Limbo</option>
                            <option value="new_keno">New Keno</option>
                            <option value="new_wheel">New Wheel</option>
                            <option value="new_roulette">New Roulette</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Currency</label>
                    <select id="currency">
                        <option value="TRY" selected>TRY</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="BRL">BRL</option>
                        <option value="INR">INR</option>
                        <option value="JPY">JPY</option>
                        <option value="GBP">GBP</option>
                        <option value="MYR">MYR</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Language</label>
                    <select id="lang">
                        <option value="en" selected>English (en)</option>
                        <option value="tr">Turkish (tr)</option>
                        <option value="fr">French (fr)</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Operator</label>
                    <input type="text" id="operator" value="1000" placeholder="e.g. 1000">
                </div>
                <div class="form-group">
                    <label>Theme Operator (optional)</label>
                    <select id="themeoperator">
                        <option value="">None</option>
                        <option value="48">48 - bettist</option>
                        <option value="10097">10097 - radabet</option>
                        <option value="10098">10098 - eurovirtual</option>
                        <option value="10100">10100 - crickso</option>
                        <option value="10116">10116 - herukul</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-row">
                    <input type="checkbox" id="isDemo">
                    <label for="isDemo">Demo Mode</label>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="form-group">
                <label>Username (for token)</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <div class="status" id="tokenStatus"></div>
        </div>

        <div class="card">
            <label>Generated URL</label>
            <div class="url-output empty" id="urlOutput">Enter username and click "Generate URL"</div>
            <div class="actions">
               <button class="btn-fetch" id="launchApiBtn">Launch via Launch URL</button>
                <button class="btn-primary" id="generateBtn">Generate URL</button>
                <button class="btn-secondary" id="copyBtn">Copy URL</button>
                <button class="btn-secondary" id="openBtn">Open URL</button>
                <span class="usercode-display" id="usercodeDisplay">
                    <span class="usercode-label">User Code:</span>
                    <span class="usercode-value" id="usercodeValue">-</span>
                </span>
            </div>
            <div class="status" id="urlStatus"></div>
        </div>

        <div class="card">
            <div class="collapsible-header" id="balanceToggle">
                <span>Update Balance</span>
                <span class="collapsible-arrow" id="balanceArrow">&#9660;</span>
            </div>
            <div class="collapsible-body" id="balanceBody">
                <div class="row">
                    <div class="form-group">
                        <label>User ID</label>
                        <input type="text" id="balanceUserId" placeholder="e.g. 1234">
                    </div>
                    <div class="form-group">
                        <label>New Balance</label>
                        <input type="text" id="balanceAmount" placeholder="e.g. 1400">
                    </div>
                </div>
                <div class="btn-row">
                    <button class="btn-fetch" id="updateBalanceBtn">Update Balance</button>
                </div>
                <div class="status" id="balanceStatus"></div>
            </div>
        </div>
    </div>

    <script>
        const GAMES = [
            { id: "1", name: "Aztec_Man" },
            { id: "2", name: "FOLLOWTHEARROW" },
            { id: "3", name: "GALAXY_GRAB" },
            { id: "4", name: "POWEROFTHOR" },
            { id: "30", name: "plinko" },
            { id: "32", name: "mines" },
            { id: "33", name: "blackjack" },
            { id: "34", name: "wheel" },
            { id: "54", name: "aviatorturbo" },
            { id: "55", name: "tower" },
            { id: "56", name: "limbo" },
            { id: "57", name: "dice" },
            { id: "58", name: "keno" },
            { id: "70", name: "crash" },
            { id: "71", name: "roulette" },
            { id: "76", name: "billionaire" },
            { id: "89", name: "runchickenrun" },
            { id: "90", name: "chickenoriginal" },
            { id: "93", name: "blackjack100" },
            { id: "95", name: "coinflip" },
            { id: "96", name: "scratch" },
            { id: "100", name: "lucky_dice", realGameId: "57" },
            { id: "101", name: "lucky_crash", realGameId: "70" },
            { id: "102", name: "roulette_x", realGameId: "71" },
            { id: "103", name: "spin_x", realGameId: "34" },
        ];

        // Map operator-specific game IDs to their real game IDs
        const OPERATOR_SPECIFIC_GAME_MAP = {
            "100": "57",  // Lucky Dice -> Dice
            "101": "70",  // Lucky Crash -> Crash
            "102": "71",  // Roulette X -> Roulette
            "103": "34",  // Spin X -> Wheel
        };

        // New games: test env only, served from /originals/test/{slug}/index.html
        const NEW_GAMES = {
            new_mines: { slug: "mines", gameId: "32" },
            new_tower: { slug: "tower", gameId: "55" },
            new_dice: { slug: "dice", gameId: "57" },
            new_crash: { slug: "crash", gameId: "70" },
            new_limbo: { slug: "limbo", gameId: "56" },
            new_keno: { slug: "keno", gameId: "58" },
            new_wheel: { slug: "wheel", gameId: "34" },
            new_roulette: { slug: "roulette", gameId: "71" },
        };

        function syncNewGameState() {
            const isNewGame = !!NEW_GAMES[document.getElementById('gameId').value];
            const envSelect = document.getElementById('env');
            if (isNewGame) envSelect.value = 'test';
            envSelect.disabled = isNewGame;
            document.getElementById('launchApiBtn').disabled = isNewGame;
        }
        document.getElementById('gameId').addEventListener('change', syncNewGameState);
        syncNewGameState();

        const OPERATORS = [
            { id: "48", name: "bettist" },
            { id: "10097", name: "radabet" },
            { id: "10098", name: "eurovirtual" },
            { id: "10100", name: "crickso" },
        ];

        function showStatus(id, message, type) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.className = 'status ' + type;
        }

        function hideStatus(id) {
            const el = document.getElementById(id);
            el.className = 'status';
            el.textContent = '';
        }

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const env = document.getElementById('env').value;
            const gameId = document.getElementById('gameId').value;
            const currency = document.getElementById('currency').value;
            const lang = document.getElementById('lang').value;
            const operator = document.getElementById('operator').value.trim();
            const themeoperator = document.getElementById('themeoperator').value;

            if (!username) {
                showStatus('tokenStatus', 'Please enter a username', 'error');
                hideStatus('urlStatus');
                return;
            }

            showStatus('tokenStatus', 'Fetching token...', 'loading');
            hideStatus('urlStatus');

            try {
                const response = await fetch('https://casino.playboo.io/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        currencyCode: currency,
                        lang: lang,
                    }),
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                const token = data.token || data.accessToken || data.jwt || data.access_token;
                const userCode = data.userCode || data.user?.userCode || data.user?.id || data.userId || data.playerId || '';

                if (!token) {
                    console.log('Login response:', data);
                    throw new Error('No token field found in response. Check console for full response.');
                }

                showStatus('tokenStatus', 'Token fetched successfully!', 'success');

                const usercodeDisplay = document.getElementById('usercodeDisplay');
                const usercodeValue = document.getElementById('usercodeValue');
                if (userCode) {
                    usercodeValue.textContent = userCode;
                    usercodeDisplay.classList.add('show');
                    const balanceUserIdInput = document.getElementById('balanceUserId');
                    if (balanceUserIdInput) balanceUserIdInput.value = userCode;
                } else {
                    usercodeValue.textContent = '-';
                    usercodeDisplay.classList.remove('show');
                }

                const newGame = NEW_GAMES[gameId];
                if (newGame) {
                    const newParams = new URLSearchParams();
                    newParams.set('gameId', newGame.gameId);
                    newParams.set('currency', currency);
                    newParams.set('operator', operator);
                    newParams.set('token', token);
                    newParams.set('lang', lang);
                    if (themeoperator) {
                        newParams.set('themeoperator', themeoperator);
                    }
                    const output = document.getElementById('urlOutput');
                    output.textContent = `https://game.exagaming.com/originals/test/${newGame.slug}/index.html?${newParams.toString()}`;
                    output.classList.remove('empty');
                    hideStatus('urlStatus');
                    return;
                }

                const FAST_PANEL_GAME_IDS = ['1', '2', '3', '4', '54'];
                const STANDALONE_FAST_GAME_IDS = ['89', '90'];
                const STANDALONE_ORIGINALS_GAME_IDS = ['30', '33', '90', '93', '95', '96'];

                // Check if this is an operator-specific game
                const operatorSpecificGameId = OPERATOR_SPECIFIC_GAME_MAP[gameId] ? gameId : null;
                // Use the real game ID for panel routing and config
                const effectiveGameId = operatorSpecificGameId ? OPERATOR_SPECIFIC_GAME_MAP[gameId] : gameId;

                const isFastPanelGame = FAST_PANEL_GAME_IDS.includes(effectiveGameId);
                const isStandaloneFastGame = STANDALONE_FAST_GAME_IDS.includes(effectiveGameId);
                const isStandaloneOriginalsGame = STANDALONE_ORIGINALS_GAME_IDS.includes(effectiveGameId);

                let baseUrl;
                if (isStandaloneFastGame) {
                    baseUrl = `https://game.exagaming.com/fast/${env}/${effectiveGameId}/index.html`;
                } else if (isStandaloneOriginalsGame) {
                    baseUrl = `https://game.exagaming.com/originals/${env}/${effectiveGameId}/index.html`;
                } else if (isFastPanelGame) {
                    baseUrl = `https://game.exagaming.com/fast/${env}/panel/${effectiveGameId}/index.html`;
                } else {
                    baseUrl = `https://game.exagaming.com/originals/${env}/panel/index.html`;
                }

                const params = new URLSearchParams();
                if (!isStandaloneFastGame) {
                    params.set('gameId', effectiveGameId);
                }
                // Add operatorSpecificGameId for operator-specific games (used only for login)
                if (operatorSpecificGameId) {
                    params.set('operatorSpecificGameId', operatorSpecificGameId);
                }
                params.set('currency', currency);
                params.set('operator', operator);
                params.set('token', token);
                params.set('lang', lang);

                if (themeoperator) {
                    params.set('themeoperator', themeoperator);
                }

                const url = `${baseUrl}?${params.toString()}`;
                const output = document.getElementById('urlOutput');
                output.textContent = url;
                output.classList.remove('empty');

                hideStatus('urlStatus');
            } catch (error) {
                console.error('Token fetch error:', error);
                showStatus('tokenStatus', 'Error: ' + error.message, 'error');
            }
        });

        // API launch endpoints by environment
        const LAUNCH_API_URLS = {
            test: 'https://api-test.exagaming.com/api/v1/game/launch',
            stage: 'https://api-stage.exagaming.com/api/v1/game/launch',
            prod: 'https://api.exagaming.com/api/v1/game/launch',
        };

        document.getElementById('launchApiBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const env = document.getElementById('env').value;
            const gameId = document.getElementById('gameId').value;
            const currency = document.getElementById('currency').value;
            const lang = document.getElementById('lang').value;
            const operator = document.getElementById('operator').value.trim();
            const themeoperator = document.getElementById('themeoperator').value;
            const isDemo = document.getElementById('isDemo').checked;

            if (NEW_GAMES[gameId]) {
                showStatus('urlStatus', 'Launch URL is not available for new games. Use "Generate URL".', 'error');
                return;
            }

            if (!username) {
                showStatus('tokenStatus', 'Please enter a username', 'error');
                hideStatus('urlStatus');
                return;
            }

            showStatus('tokenStatus', 'Fetching token...', 'loading');
            hideStatus('urlStatus');

            try {
                // Step 1: Fetch token
                const loginResponse = await fetch('https://casino.playboo.io/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        currencyCode: currency,
                        lang: lang,
                    }),
                });

                if (!loginResponse.ok) {
                    const errorText = await loginResponse.text();
                    throw new Error(`Login HTTP ${loginResponse.status}: ${errorText}`);
                }

                const loginData = await loginResponse.json();
                const token = loginData.token || loginData.accessToken || loginData.jwt || loginData.access_token;
                const userCode = loginData.userCode || loginData.user?.userCode || loginData.user?.id || loginData.userId || loginData.playerId || '';

                if (!token) {
                    console.log('Login response:', loginData);
                    throw new Error('No token field found in login response. Check console for full response.');
                }

                showStatus('tokenStatus', 'Token fetched! Calling launch API...', 'success');

                const usercodeDisplay = document.getElementById('usercodeDisplay');
                const usercodeValue = document.getElementById('usercodeValue');
                if (userCode) {
                    usercodeValue.textContent = userCode;
                    usercodeDisplay.classList.add('show');
                    const balanceUserIdInput = document.getElementById('balanceUserId');
                    if (balanceUserIdInput) balanceUserIdInput.value = userCode;
                } else {
                    usercodeValue.textContent = '-';
                    usercodeDisplay.classList.remove('show');
                }

                // Step 2: Call game launch API
                const launchApiUrl = LAUNCH_API_URLS[env] || LAUNCH_API_URLS.test;
                const launchBody = {
                    operator: Number(operator),
                    gameId: Number(gameId),
                    token: token,
                    currency: currency,
                    lang: lang,
                    isDemo: isDemo,
                };
                if (themeoperator) {
                    launchBody.launchOperator = Number(themeoperator);
                }

                showStatus('tokenStatus', 'Calling launch API...', 'loading');

                const launchResponse = await fetch(launchApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(launchBody),
                });

                if (!launchResponse.ok) {
                    const errorText = await launchResponse.text();
                    throw new Error(`Launch API HTTP ${launchResponse.status}: ${errorText}`);
                }

                const launchData = await launchResponse.json();

                if (launchData.status !== 'SUCCESS' || !launchData.data || !launchData.data.launchUrl) {
                    console.log('Launch API response:', launchData);
                    throw new Error('Launch API did not return a launch URL. Check console for full response.');
                }

                const launchUrl = launchData.data.launchUrl;
                const output = document.getElementById('urlOutput');
                output.textContent = launchUrl;
                output.classList.remove('empty');

                showStatus('tokenStatus', 'Launch URL generated successfully!', 'success');
                showStatus('urlStatus', `API: ${launchApiUrl}`, 'success');
                setTimeout(() => hideStatus('urlStatus'), 4000);
            } catch (error) {
                console.error('Launch API error:', error);
                showStatus('tokenStatus', 'Error: ' + error.message, 'error');
            }
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const output = document.getElementById('urlOutput');
            if (output.classList.contains('empty')) {
                showStatus('urlStatus', 'Generate a URL first', 'error');
                return;
            }
            navigator.clipboard.writeText(output.textContent).then(() => {
                showStatus('urlStatus', 'URL copied to clipboard!', 'success');
                setTimeout(() => hideStatus('urlStatus'), 2000);
            }).catch(() => {
                showStatus('urlStatus', 'Failed to copy', 'error');
            });
        });

        document.getElementById('openBtn').addEventListener('click', () => {
            const output = document.getElementById('urlOutput');
            if (output.classList.contains('empty')) {
                showStatus('urlStatus', 'Generate a URL first', 'error');
                return;
            }
            window.open(output.textContent, '_blank');
        });

        // Collapsible toggle for Update Balance
        document.getElementById('balanceToggle').addEventListener('click', () => {
            const body = document.getElementById('balanceBody');
            const arrow = document.getElementById('balanceArrow');
            body.classList.toggle('open');
            arrow.classList.toggle('open');
        });

        document.getElementById('updateBalanceBtn').addEventListener('click', async () => {
            const userId = document.getElementById('balanceUserId').value.trim();
            const newBalance = document.getElementById('balanceAmount').value.trim();

            if (!userId) {
                showStatus('balanceStatus', 'Please enter a user ID', 'error');
                return;
            }
            if (!newBalance || isNaN(Number(newBalance))) {
                showStatus('balanceStatus', 'Please enter a valid balance', 'error');
                return;
            }

            showStatus('balanceStatus', 'Updating balance...', 'loading');

            try {
                const response = await fetch('https://casino.playboo.io/update-balance', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userId: userId,
                        newBalance: Number(newBalance),
                    }),
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.text();
                showStatus('balanceStatus', `Balance updated for user ${userId} to ${newBalance}`, 'success');
                setTimeout(() => hideStatus('balanceStatus'), 3000);
            } catch (error) {
                console.error('Update balance error:', error);
                showStatus('balanceStatus', 'Error: ' + error.message, 'error');
            }
        });
    </script>
</body>
</html>
